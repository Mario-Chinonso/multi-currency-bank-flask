<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit Funds</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap-5.3.8-dist/css/bootstrap.min.css') }}" />
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .deposit-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 480px;
            width: 100%;
        }
        .balance-badge {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
        }
        .form-control, .form-select {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #ffffff;
        }
        .form-control:focus, .form-select:focus {
            background-color: #0f172a;
            border-color: #10b981;
            color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(16, 185, 129, 0.25);
        }
        .input-group-text {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #10b981;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container p-3">
        <div class="deposit-card p-4 p-md-5 mx-auto">
            
            <!-- Top Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">Deposit Funds</h3>
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary btn-sm">← Back</a>
            </div>

            <!-- Current Balance Display -->
            <div class="balance-badge p-3 mb-4 text-center">
                <span class="text-secondary small text-uppercase fw-bold d-block mb-1">Current Balance</span>
                <h2 class="text-success fw-bold mb-0 text-break">₦ {{ "{:,.2f}".format(balance) }}</h2>
            </div>

            <!-- Deposit Form -->
            <form action="{{ url_for('deposit') }}" method="POST">
                
                <!-- Currency Selector -->
                <div class="mb-3">
                    <label for="currency" class="form-label text-secondary fw-semibold">Select Currency</label>
                    <select name="currency" id="currency" class="form-select form-select-lg" required>
                        <option value="NGN" selected>Naira (₦)</option>
                        <option value="USD">US Dollar ($)</option>
                        <option value="CNY">Chinese Yuan (¥)</option>
                    </select>
                </div>

                <!-- Amount Input -->
                <div class="mb-4">
                    <label for="amount" class="form-label text-secondary fw-semibold">Enter Amount to Deposit</label>
                    <div class="input-group">
                        <input 
                            type="number" 
                            step="0.01" 
                            min="1" 
                            class="form-control form-control-lg" 
                            id="amount" 
                            name="amount" 
                            placeholder="0.00" 
                            required
                            autofocus
                        >
                    </div>
                    <div class="form-text text-secondary mt-2">Foreign currencies auto-convert to NGN balance.</div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow-sm">
                    Confirm Deposit
                </button>
            </form>

        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
