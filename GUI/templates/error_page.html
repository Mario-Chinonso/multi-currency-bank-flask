<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Page</title>
    <!-- Local Bootstrap -->
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap-5.3.8-dist/css/bootstrap.min.css') }}" />
    
    <!-- Google Fonts Preconnect & Link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b1329;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-card {
            background: rgba(16, 28, 48, 0.85);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            max-width: 420px;
            width: 100%;
        }
        .error-heading {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 800;
            color: #ef4444;
            letter-spacing: -1px;
        }
    </style>
</head>
<body>

    <div class="error-card p-4 p-md-5 text-center mx-3">
        <h1 class="error-heading display-4 mb-2">Error</h1>
        <p class="text-secondary mb-4">Something went wrong with your request.</p>
        <!-- <p class="text-secondary mb-4">Wrong password or username.</p> -->
        {% with messages = get_flashed_messages(with_categories=true) %}
           {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{'danger' if category == 'danger' or category == 'error' else 'success'}} alert-dismissible fade show mb-3"  role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
           <a href="{{ url_for('login') }}" class="btn btn-outline-danger btn-sm px-4 fw-bold rounded-pill">
            Return to Safety
        </a>
    </div>

</body>
</html>
