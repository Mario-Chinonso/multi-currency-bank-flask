<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opay Terminal - Welcome</title>
    <!-- Local Bootstrap -->
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap-5.3.8-dist/css/bootstrap.min.css') }}" />
    <!-- Modern Tech Fonts: Space Grotesk & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b1329;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1.5rem 0;
        }

        .hero-card {
            background: rgba(16, 28, 48, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border-radius: 24px;
            max-width: 520px;
            width: 100%;
        }

        .brand-title {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 800;
            font-size: 2.2rem;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .brand-accent {
            color: #0ea5e9;
        }

        .btn-primary-custom {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            border: none;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 12px;
            padding: 0.85rem;
            transition: all 0.2s ease-in-out;
        }

        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.35);
            color: #ffffff;
        }

        .btn-outline-custom {
            background: transparent;
            border: 1px solid #334155;
            color: #f8fafc;
            font-weight: 600;
            border-radius: 12px;
            padding: 0.85rem;
            transition: all 0.2s ease-in-out;
        }

        .btn-outline-custom:hover {
            background-color: #0f172a;
            border-color: #0ea5e9;
            color: #0ea5e9;
            transform: translateY(-2px);
        }

        .badge-bonus {
            background-color: rgba(14, 165, 233, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            font-weight: 600;
            font-size: 0.78rem;
            padding: 0.4rem 0.8rem;
            border-radius: 50px;
            display: inline-block;
        }

        .footer-text {
            color: #64748b;
            font-size: 0.85rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container p-3">
        <div class="hero-card p-4 p-md-5 text-center mx-auto">
            
            <!-- Welcome Badge -->
            <div class="mb-3">
                <span class="badge-bonus">🎁 Get ₦20,000 Sign-up Bonus</span>
            </div>

            <!-- Title & Subtitle -->
            <h1 class="brand-title mb-2">
                Opay <span class="brand-accent">Terminal</span>
            </h1>
            <p class="text-secondary mb-4 fs-6">
                Secure, offline-first banking portal. Manage deposits, withdrawals, and account details in one place.
            </p>

            <!-- Action Buttons -->
            <div class="d-grid gap-3 mb-4">
                <a href="{{ url_for('signup') }}" class="btn btn-primary-custom text-decoration-none">
                    Create New Account
                </a>
                <a href="{{ url_for('login') }}" class="btn btn-outline-custom text-decoration-none">
                    Log In to Terminal
                </a>
            </div>

            <!-- Developer Credit -->
            <p class="footer-text mt-4 mb-0">© Maduka Chinonso | Software Developer</p>
        </div>
    </div>

</body>
</html>
