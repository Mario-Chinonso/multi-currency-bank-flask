<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Local Bootstrap -->
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap-5.3.8-dist/css/bootstrap.min.css') }}" />
    <!-- Modern Tech Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b1329; /* Richer dark navy background */
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: rgba(16, 28, 48, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            max-width: 440px;
            width: 100%;
        }

        .login-title {
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #ffffff;
            font-size: 2rem;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }

        .custom-input {
            background-color: #0f172a !important;
            border: 1px solid #334155 !important;
            color: #ffffff !important;
            font-weight: 500;
            border-radius: 12px;
            padding: 0.75rem 1rem;
        }

        .custom-input:focus {
            border-color: #0ea5e9 !important;
            box-shadow: 0 0 0 0.25rem rgba(14, 165, 233, 0.25) !important;
        }

        .custom-input::placeholder {
            color: #64748b;
        }

        .btn-submit {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            border: none;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 12px;
            padding: 0.85rem;
            transition: all 0.2s ease-in-out;
            width: 100%; /* Fully responsive button that fills the card */
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.35);
            color: #ffffff;
        }

        .footer-text {
            color: #64748b;
            font-size: 0.85rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container p-3">
        <div class="login-card p-4 p-md-5 mx-auto">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                  {% for category, message in messages %}
                    <div class="alert alert-{{'danger' if category == 'danger' or category == 'error' else 'success'}} alert-dismissible fade show mb-3" role="alert">
                       {{ message }}
                      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                  {% endfor %}
                {% endif %}
            {% endwith %}
            <!-- Header Section -->
            <div class="text-center mb-4">
                <h1 class="login-title mb-1">LOG IN</h1>
                <p class="text-secondary small">Access your Opay Terminal account</p>
            </div>

            <!-- Login Form -->
            <form action="/login" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input 
                        required 
                        name="username" 
                        type="text" 
                        spellcheck="true" 
                        placeholder="Enter your username" 
                        class="form-control custom-input"
                        id="username"
                    >
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input 
                        required 
                        type="password" 
                        name="password" 
                        placeholder="Enter your password" 
                        class="form-control custom-input"
                        id="password"
                    >
                </div>

                <button type="submit" class="btn btn-submit shadow-sm">
                    Submit
                </button>
            </form>
            
            <p class="text-center mb-2 mt-4">Don't have an account? <a href="{{url_for('signup')}}">Create account!</a></p>
            <p class="text-center footer-text mt-4 mb-0">©️ Maduka Chinonso | Software Developer</p>
        </div>
    </div>

</body>
</html>
