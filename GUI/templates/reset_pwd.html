<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <!-- Local Bootstrap CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap-5.3.8-dist/css/bootstrap.min.css') }}" />
    <!-- Modern Tech Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b1329;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reset-card {
            background: rgba(16, 28, 48, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            max-width: 480px;
            width: 100%;
        }

        .card-title {
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
            font-size: 1.8rem;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.88rem;
            color: #94a3b8;
            margin-bottom: 0.4rem;
        }

        .custom-input {
            background-color: #0f172a !important;
            border: 1px solid #334155 !important;
            color: #ffffff !important;
            font-weight: 500;
            border-radius: 12px;
            padding: 0.75rem 1rem;
        }

        .custom-input:focus {
            border-color: #eab308 !important; /* Warning gold color for security changes */
            box-shadow: 0 0 0 0.25rem rgba(234, 179, 8, 0.2) !important;
        }

        .custom-input::placeholder {
            color: #64748b;
        }

        .btn-submit {
            background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
            border: none;
            color: #000000;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 12px;
            padding: 0.85rem;
            transition: all 0.2s ease-in-out;
            width: 100%;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(234, 179, 8, 0.3);
            color: #000000;
        }

        .footer-text {
            color: #64748b;
            font-size: 0.85rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container p-3">
        <div class="reset-card p-4 p-md-5 mx-auto">
            
            <!-- Top Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="card-title mb-0">Reset Password</h2>
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary btn-sm rounded-3">← Back</a>
            </div>

            <!-- Dynamic Error Alert -->
            {% if error %}
            <div class="alert alert-danger alert-dismissible fade show text-center py-2 fs-7" role="alert">
                <strong>Error:</strong> {{ error }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endif %}

            <!-- Dynamic Success Alert -->
            {% if success %}
            <div class="alert alert-success alert-dismissible fade show text-center py-2 fs-7" role="alert">
                <strong>Success!</strong> {{ success }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endif %}

            <!-- Form -->
            <form action="{{ url_for('reset_pwd') }}" method="POST">
                
                <!-- Current Password -->
                <div class="mb-3">
                    <label for="current_password" class="form-label">Current Password</label>
                    <input 
                        required 
                        type="password" 
                        name="current_pwd" 
                        id="current_password"
                        placeholder="Enter your current password" 
                        class="form-control custom-input"
                        autofocus
                    >
                </div>

                <!-- New Password -->
                <div class="mb-3">
                    <label for="new_password" class="form-label">New Password</label>
                    <input 
                        required 
                        type="password" 
                        name="new_pwd" 
                        id="new_password"
                        placeholder="Enter your new password" 
                        class="form-control custom-input"
                    >
                </div>

                <!-- Confirm New Password -->
                <div class="mb-4">
                    <label for="confirm_password" class="form-label">Confirm New Password</label>
                    <input 
                        required 
                        type="password" 
                        name="confirm_pwd" 
                        id="confirm_password"
                        placeholder="Re-enter your new password" 
                        class="form-control custom-input"
                    >
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-submit shadow-sm">
                    Update Password
                </button>
            </form>

            <p class="text-center footer-text mt-4 mb-0">©️ Maduka Chinonso | Software Developer</p>
        </div>
    </div>

</body>
</html>
