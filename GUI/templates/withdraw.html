<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw Funds</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap-5.3.8-dist/css/bootstrap.min.css') }}" />
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .withdraw-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 480px;
            width: 100%;
        }
        .balance-badge {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
        }
        .form-control {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #ffffff;
        }
        .form-control:focus {
            background-color: #0f172a;
            border-color: #ef4444; /* Red focus border for withdrawals */
            color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(239, 68, 68, 0.25);
        }
        .input-group-text {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #ef4444;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container p-3">
        <div class="withdraw-card p-4 p-md-5 mx-auto">
            
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0 text-danger">Withdraw Funds</h3>
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary btn-sm">← Back</a>
            </div>

            <!-- Current Balance Display -->
            <div class="balance-badge p-3 mb-4 text-center">
                <span class="text-secondary small text-uppercase fw-bold d-block mb-1">Available Balance</span>
                <h2 class="text-success fw-bold mb-0 text-break">₦ {{ "{:,.2f}".format(balance) }}</h2>
            </div>

            <!-- Withdrawal Form -->
            <form action="{{ url_for('withdraw') }}" method="POST">
                <div class="mb-4">
                    <label for="amount" class="form-label text-secondary fw-semibold">Enter Amount to Withdraw</label>
                    <div class="input-group">
                        <span class="input-group-text">₦</span>
                        <input 
                            type="number" 
                            step="0.01" 
                            min="1" 
                            max="{{ balance }}"
                            class="form-control form-control-lg" 
                            id="amount" 
                            name="amount" 
                            placeholder="0.00" 
                            required
                            autofocus
                        >
                    </div>
                    <div class="form-text text-secondary mt-2">You cannot withdraw more than your available balance.</div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-danger btn-lg w-100 fw-bold shadow-sm">
                    Confirm Withdrawal
                </button>
            </form>

        </div>
    </div>
    <!-- Error Message Alert -->
{% if error %}
<div class="alert alert-danger alert-dismissible fade show text-center" role="alert">
    <strong>Error!</strong> {{ error }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
{% endif %}

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
